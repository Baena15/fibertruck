<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e40af">
  <meta name="description" content="Diagnostico FTTH y gestion operativa de incidencias para Cieza, Murcia">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FiberTrack">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/frontend/icons/icon-192x192.png">
  <title>FiberTrack - Diagnostico FTTH + Gestion de incidencias Cieza</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 100%; min-height: 400px; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      document.body.innerHTML = '<div style="padding:40px;font-family:monospace;"><h2 style="color:red">JavaScript Error</h2><pre style="background:#fee;padding:20px;border-radius:8px">' + msg + '\nLine: ' + line + '\nURL: ' + (url||'') + '</pre><p style="color:#666;margin-top:20px">Si el error persiste, contacta al administrador.</p></div>';
      return true;
    };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(function(reg) { console.log('FiberTrack SW registrado', reg.scope); })
        .catch(function(err) { console.warn('FiberTrack SW error', err); });
    }
  </script>
  <script type="text/javascript" src="/static/frontend/app.v9.js"></script>
</body>
</html>
