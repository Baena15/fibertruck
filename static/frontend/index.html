<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiberTruck - Diagnostico FTTH Cieza</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fiber: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
          }
        }
      }
    }
  </script>
  <style>
    #map { height: 100%; min-height: 400px; border-radius: 0.5rem; }
    .pulse-marker { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    .diagnosis-card { transition: all 0.3s ease; }
    .severity-critical { border-left: 4px solid #dc2626; background: #fef2f2; }
    .severity-high { border-left: 4px solid #f59e0b; background: #fffbeb; }
    .severity-medium { border-left: 4px solid #3b82f6; background: #eff6ff; }
    .severity-low { border-left: 4px solid #10b981; background: #ecfdf5; }
    .power-bar-bg { background: #e5e7eb; height: 20px; border-radius: 4px; }
    .power-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .cable-feeder { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 10,5; }
    .cable-distribution { stroke: #2563eb; stroke-width: 3; }
    .cable-drop { stroke: #16a34a; stroke-width: 2; stroke-dasharray: 5,5; }
    .topology-tree { font-family: monospace; }
    .topology-tree .expand-btn { cursor: pointer; user-select: none; }
    .step-number { width: 28px; height: 28px; border-radius: 50%; background: #0ea5e9; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="text/babel" src="/static/frontend/app.jsx"></script>
</body>
</html>
