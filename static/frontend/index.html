<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiberTruck - Diagnostico FTTH Cieza</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 100%; min-height: 400px; border-radius: 0.5rem; }
    .severity-critical { border-left: 4px solid #dc2626; background: #fef2f2; }
    .severity-high { border-left: 4px solid #f59e0b; background: #fffbeb; }
    .severity-medium { border-left: 4px solid #3b82f6; background: #eff6ff; }
    .severity-low { border-left: 4px solid #10b981; background: #ecfdf5; }
    .power-bar-bg { background: #e5e7eb; height: 20px; border-radius: 4px; }
    .power-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="text/javascript" src="/static/frontend/app.jsx"></script>
</body>
</html>
