<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiberTrack - Diagnostico FTTH + Gestion de incidencias Cieza</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 100%; min-height: 400px; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      document.body.innerHTML = '<div style="padding:40px;font-family:monospace;"><h2 style="color:red">JavaScript Error</h2><pre style="background:#fee;padding:20px;border-radius:8px">' + msg + '\nLine: ' + line + '\nURL: ' + (url||'') + '</pre><p style="color:#666;margin-top:20px">Si el error persiste, contacta al administrador.</p></div>';
      return true;
    };
  </script>
  <script type="text/javascript" src="/static/frontend/app.v9.js"></script>
</body>
</html>
